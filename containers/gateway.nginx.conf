# BugSense gateway. Browser -> gateway (port 8080) -> the right container.
# The containers have fixed addresses on the bugsense network (see compose.yaml),
# so a container that restarts comes back at the same address.

# The UI: web-main serves every page. If it does not answer (stopped, crashed,
# restarting), nginx sends the same request to web-backup instead, and keeps
# using the backup for 10 seconds before trying web-main again.
upstream bugsense_ui {
    server 10.90.7.21:80 max_fails=1 fail_timeout=10s;   # web-main
    server 10.90.7.22:80 backup;                         # web-backup
}

upstream bugsense_api {
    server 10.90.7.10:8000;                              # api
}

server {
    listen 8080;
    client_max_body_size 50m;          # log uploads

    # The gateway itself
    location = /gateway/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The backend: /api/logs -> api:8000/logs
    location /api/ {
        proxy_pass http://bugsense_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # an AI diagnosis can wait for the free tier's limit
    }

    # OpenTelemetry from programs outside the containers (OTLP/HTTP)
    location /v1/ {
        proxy_pass http://bugsense_api;
        proxy_set_header Host $host;
    }

    # Everything else is the UI, with the switch to the backup
    location / {
        proxy_pass http://bugsense_ui;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        add_header X-BugSense-Gateway "1" always;
    }
}
