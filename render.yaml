# Render Blueprint: the public link for showcasing BugSense.
# Render builds the SAME container images as Podman (containers/*.Containerfile).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# Step-by-step guide: DEPLOY.md   (the full Podman setup with the backup UI: PODMAN.md)

services:
  # The backend container (FastAPI + the demo shop that sends live OpenTelemetry)
  - type: web
    name: bugsense-api
    runtime: docker
    plan: free
    dockerfilePath: ./containers/api.Containerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugsense-db
          property: connectionString
      # Signs the sign-in tokens; Render makes a random one
      - key: SECRET_KEY
        generateValue: true
      # Only programs that know this may send OpenTelemetry data
      - key: INGEST_TOKEN
        generateValue: true
      # The address of the UI below (allowed to call this API).
      # If Render gives the UI a different address, change it here.
      - key: FRONTEND_URL
        value: https://bugsense-web.onrender.com
      # Visitors can create their own account to try BugSense.
      # Set to "false" in the dashboard to close sign-up.
      - key: ALLOW_SIGNUP
        value: "true"
      # Your free Groq key; Render asks for it when the Blueprint is created
      - key: LLM_API_KEY
        sync: false

  # The UI container (React built once, served by nginx)
  - type: web
    name: bugsense-web
    runtime: docker
    plan: free
    dockerfilePath: ./containers/web.Containerfile
    dockerContext: .
    healthCheckPath: /served-by
    envVars:
      # Used while building the UI (Render passes it as a build argument).
      # If Render gives the backend a different address, change it here and
      # redeploy this service.
      - key: VITE_API_URL
        value: https://bugsense-api.onrender.com
      # Shown in the top bar: which container served the page
      - key: UI_NAME
        value: render

databases:
  - name: bugsense-db
    plan: free
    databaseName: bugsense
