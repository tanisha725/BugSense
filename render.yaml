# Render Blueprint: creates the whole of BugSense in one go.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# Step-by-step guide: DEPLOY.md

services:
  # The FastAPI backend (it also starts the demo shop when asked)
  - type: web
    name: bugsense-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugsense-db
          property: connectionString
      # Signs the sign-in tokens; Render makes a random one
      - key: SECRET_KEY
        generateValue: true
      # Only programs that know this may send OpenTelemetry data
      - key: INGEST_TOKEN
        generateValue: true
      # The address of the frontend below (allowed to call this API).
      # If Render gives the frontend a different address, change it here.
      - key: FRONTEND_URL
        value: https://bugsense-web.onrender.com
      # Your free Groq key; Render asks for it when the Blueprint is created
      - key: LLM_API_KEY
        sync: false

  # The React frontend, built once and served as plain files
  - type: web
    name: bugsense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Every page address (/incidents/12, /telemetry, ...) is handled by React
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The address of the backend above.
      # If Render gives the backend a different address, change it here.
      - key: VITE_API_URL
        value: https://bugsense-api.onrender.com

databases:
  - name: bugsense-db
    plan: free
    databaseName: bugsense
